<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enroll | Afraah Tech Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #F5F1E7; /* Cream */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border-top: 8px solid #0B3D2E; /* Green */
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0B3D2E;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0B3D2E;
      outline: none;
      box-shadow: 0 0 5px rgba(11,61,46,0.3);
    }
    button {
      background: #7A1C1C; /* Maroon */
      color: #fff;
      padding: 12px;
      border: none;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background: #5c1414;
      transform: scale(1.02);
    }
    .success {
      display: none;
      background: #0B3D2E;
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Enroll at Afraah Tech Hub</h2>
    <form id="enrollForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>
      
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>
      
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. +234 812 345 6789" required>
      
      <label for="program">Select Program</label>
      <select id="program" required>
        <option value="">-- Choose a Program --</option>
        <option>Smartphone Graphics Design</option>
        <option>UI/UX Design</option>
        <option>Data Science</option>
        <option>Artificial Intelligence</option>
        <option>Web Development</option>
      </select>
      
      <label for="message">Your Expectation (Optional)</label>
      <textarea id="message" rows="4" placeholder="Tell us what you hope to gain..."></textarea>
      
      <button type="submit">Submit Enrollment</button>
    </form>
    <div class="success" id="successMessage">
      🎉 Thank you for enrolling! We will contact you shortly.
    </div>
  </div>

  <script>
    const form = document.getElementById("enrollForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      successMessage.style.display = "block";
      form.reset();
      setTimeout(() => {
        successMessage.style.display = "none";
      }, 4000);
    });
  </script>
</body>
</html>
